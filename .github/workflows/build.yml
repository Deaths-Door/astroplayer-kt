name: Build Modules CI

on:
    workflow_dispatch:
    push:
      branches:
        - '**'

jobs:
    build: 
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-java@v3
          with:
            distribution: "adopt"
            java-version: "17"

        - name: Setup Gradle
          uses: gradle/gradle-build-action@v2

            # To fix ./gradlew: Permission denied
        - run: chmod +x gradlew
        - run: ./gradlew astroplayer-core:build astroplayer-ui:build

