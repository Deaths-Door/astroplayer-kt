name: Build Modules CI

on:
    workflow_dispatch:
    push:
      branches:
        - '**'

jobs:
  Android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

        # To fix ./gradlew: Permission denied
      - run: chmod +x gradlew

      - name: Build Android
        run: ./gradlew astroplayer-core:build astroplayer-ui:build

  Desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

    # To fix ./gradlew: Permission denied
      - run: chmod +x gradlew

      - name: Build Desktop
        run: ./gradlew astroplayer-core:desktopMainClasses astroplayer-core:desktopTestClasses astroplayer-ui:desktopMainClasses astroplayer-ui:desktopTestClasses

  iOS:
    runs-on: macos-12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

    # To fix ./gradlew: Permission denied
      - run: chmod +x gradlew

      - name: Build iOS Framework
        run: ./gradlew astroplayer-core:assembleXCFramework astroplayer-ui:assembleXCFramework
  Wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

    # To fix ./gradlew: Permission denied
      - run: chmod +x gradlew

      - name: Build WASM
        run: ./gradlew astroplayer-core:wasmJsMainClasses astroplayer-core:wasmJsTestClasses astroplayer-ui:wasmJsMainClasses astroplayer-ui:wasmJsTestClasses
